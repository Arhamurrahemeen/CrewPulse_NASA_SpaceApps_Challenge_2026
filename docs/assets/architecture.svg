<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Architecture: React pages in the browser call a local FastAPI backend with rules, baseline, rPPG and DONKI modules over SQLite. The webcam stays local; NASA DONKI is fetched only when online. A demo build reads simulated JSON on GitHub Pages.">
